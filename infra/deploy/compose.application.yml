services:
  redis:
    container_name: arenacore-redis
    image: redis:8.6.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${ARENACORE_REDIS_PASSWORD:?set ARENACORE_REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "${APP_PRIVATE_IP:?set APP_PRIVATE_IP}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${ARENACORE_REDIS_PASSWORD:?set ARENACORE_REDIS_PASSWORD}
    networks: [arenacore]

  api:
    container_name: arenacore-api
    image: ${ARENACORE_API_IMAGE:?set ARENACORE_API_IMAGE}
    restart: unless-stopped
    env_file:
      - /etc/arenacore/api.env
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      edge:
        aliases: [arenacore-api]
      arenacore:

networks:
  edge:
    external: true
    name: ${CADDY_NETWORK:-watchtower_backend}
  arenacore:

volumes:
  redis_data:
