# Infrastructure for local development only. This is not an execution sandbox.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: arenacore
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: arenacore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenacore -d arenacore"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.6.6-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redis_data:
  postgres_data:
