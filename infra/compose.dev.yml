# Infrastructure for local development only. This is not an execution sandbox.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: arenacore
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: arenacore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenacore -d arenacore"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
