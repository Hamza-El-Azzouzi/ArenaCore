name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: arenacore
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: arenacore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenacore -d arenacore_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.6.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://arenacore:integration-only@localhost:5432/arenacore_test
      TEST_DATABASE_URL: postgresql://arenacore:integration-only@localhost:5432/arenacore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run check
      - run: npm audit --audit-level=moderate
